appId: com.ultrapc.dodocode
directories:
  output: release
files:
  - out/**/*
  # Images the main process opens by path, such as the tray icons.
  - resources/**/*
  - package.json
# The Claude Agent SDK runs its platform's `claude` binary, which can't run from inside the asar.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: [nsis]
linux:
  target: [AppImage]
  category: Development
  # The app icons sit in build/, made from build/logo.svg by `pnpm icons`. macOS and Windows find
  # icon.icns and icon.ico there by name; Linux takes this folder of sizes.
  icon: icons
