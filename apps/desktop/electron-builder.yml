appId: com.ultrapc.dodocode
directories:
  output: release
files:
  - out/**/*
  # resources/ holds the tray icons, made ahead of a tray the app does not have yet. Nothing opens
  # them, so the app leaves them out: add `resources/**/*` here with the first code that does.
  - package.json
# The Claude Agent SDK runs its platform's `claude` binary, which can't run from inside the asar.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: [nsis]
linux:
  target: [AppImage]
  category: Development
  # The app icons sit in build/, made from build/logo.svg by `pnpm icons`. macOS and Windows find
  # icon.icns and icon.ico there by name; Linux takes this folder of sizes.
  icon: icons
